# Local CI (budget zéro) — see docs/14-conventions-dev.md §4.
pre-commit:
  parallel: true
  jobs:
    - name: lint
      glob: "*.{ts,tsx,js,json}"
      run: pnpm biome check --no-errors-on-unmatched {staged_files}
    - name: typecheck
      run: pnpm turbo run typecheck
    - name: test
      run: pnpm turbo run test

pre-push:
  jobs:
    - name: build
      run: pnpm turbo run build
