<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
<meta name="theme-color" content="#111418" />
<title>Télécommande HomeRealTrainer</title>
<style>
  :root { color-scheme: dark; --bg:#111418; --fg:#f2f4f7; --mute:#8a94a3; --btn:#1f2630; --on:#2f7df6; --ok:#3ecf8e; --bad:#ef5b5b; }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin:0; height:100%; background:var(--bg); color:var(--fg); font-family: system-ui, sans-serif; overscroll-behavior:none; }
  body { display:flex; flex-direction:column; gap:10px; padding:max(10px, env(safe-area-inset-top)) max(10px, env(safe-area-inset-right)) max(10px, env(safe-area-inset-bottom)) max(10px, env(safe-area-inset-left)); user-select:none; -webkit-user-select:none; touch-action:manipulation; }
  header { display:flex; justify-content:space-between; align-items:center; font-size:14px; color:var(--mute); }
  #state::before { content:"●"; margin-right:6px; color:var(--bad); }
  #state.ok::before { color:var(--ok); }
  main { flex:1; display:grid; grid-template-rows: 3fr 2fr 2fr 2fr 1.4fr; gap:10px; min-height:0; }
  .row { display:grid; grid-auto-flow:column; grid-auto-columns:1fr; gap:10px; min-height:0; }
  button { border:0; border-radius:18px; background:var(--btn); color:var(--fg); font:inherit; font-weight:700; font-size:clamp(18px, 5vw, 30px); display:flex; flex-direction:column; align-items:center; justify-content:center; gap:4px; min-height:0; touch-action:manipulation; }
  button small { font-size:13px; font-weight:500; color:var(--mute); }
  button.down { background:var(--on); }
  button.big { font-size:clamp(40px, 12vw, 72px); }
  #hint { text-align:center; font-size:12px; color:var(--mute); min-height:1.2em; }
</style>
</head>
<body>
<header><span id="state">Connexion…</span><span id="who"></span></header>
<main>
  <div class="row">
    <button type="button" class="big" data-b="shiftDown" aria-label="Rapport plus facile">−<small>Rapport</small></button>
    <button type="button" class="big" data-b="shiftUp" aria-label="Rapport plus dur">+<small>Rapport</small></button>
  </div>
  <div class="row">
    <button type="button" data-b="ergDown" aria-label="ERG moins 5 watts">−5 W<small>ERG</small></button>
    <button type="button" data-b="ergUp" aria-label="ERG plus 5 watts">+5 W<small>ERG</small></button>
  </div>
  <div class="row">
    <button type="button" data-b="ergDown10" aria-label="ERG moins 10 watts">−10 W<small>ERG</small></button>
    <button type="button" data-b="ergUp10" aria-label="ERG plus 10 watts">+10 W<small>ERG</small></button>
  </div>
  <div class="row">
    <button type="button" data-b="shiftFrontDown" aria-label="Petit plateau">Petit<small>plateau</small></button>
    <button type="button" data-b="shiftFrontUp" aria-label="Grand plateau">Grand<small>plateau</small></button>
  </div>
  <div class="row">
    <button type="button" data-b="pause">Pause</button>
    <button type="button" data-b="cameraNext">Caméra</button>
    <button type="button" data-b="lap">Tour</button>
    <button type="button" data-b="intervalNext">Suivant</button>
  </div>
</main>
<div id="hint"></div>
<script>
(() => {
  const room = new URLSearchParams(location.search).get('r') || '';
  const stateEl = document.getElementById('state');
  const hint = document.getElementById('hint');
  let ws = null, hosts = 0, attempt = 0, retry = null, wake = null;
  const held = new Map(); // pointerId -> button

  const buzz = (p) => { try { navigator.vibrate && navigator.vibrate(p); } catch (_) {} };
  const show = (text, ok) => { stateEl.textContent = text; stateEl.className = ok ? 'ok' : ''; };
  const refresh = () => {
    if (!ws || ws.readyState !== 1) return show('Hors ligne — reconnexion…', false);
    show(hosts > 0 ? 'Connecté au jeu' : 'En attente du jeu…', hosts > 0);
  };

  function connect() {
    clearTimeout(retry);
    const proto = location.protocol === 'https:' ? 'wss' : 'ws';
    ws = new WebSocket(proto + '://' + location.host + '/ws?role=remote&room=' + encodeURIComponent(room));
    ws.onopen = () => { attempt = 0; hosts = 0; refresh(); };
    ws.onmessage = (e) => {
      let m; try { m = JSON.parse(e.data); } catch (_) { return; }
      if (m.t === 'peers') { hosts = m.hosts | 0; refresh(); }
      if (m.t === 'buzz') buzz(25);
    };
    ws.onclose = (e) => {
      hosts = 0; refresh();
      if (e.code === 1008) { show('Lien refusé : scanne de nouveau le QR code', false); return; }
      retry = setTimeout(connect, Math.min(5000, 500 * 2 ** attempt++));
    };
  }

  const send = (t, b) => { if (ws && ws.readyState === 1) ws.send(JSON.stringify({ t, b })); };

  function press(btn, id) {
    if (held.has(id)) return;
    held.set(id, btn.dataset.b);
    btn.classList.add('down');
    buzz(12);
    send('press', btn.dataset.b);
  }
  function release(btn, id) {
    const b = held.get(id);
    if (!b) return;
    held.delete(id);
    btn.classList.remove('down');
    send('release', b);
  }

  document.querySelectorAll('button[data-b]').forEach((btn) => {
    btn.addEventListener('pointerdown', (e) => { btn.setPointerCapture(e.pointerId); press(btn, e.pointerId); e.preventDefault(); });
    for (const ev of ['pointerup', 'pointercancel', 'lostpointercapture']) btn.addEventListener(ev, (e) => release(btn, e.pointerId));
    btn.addEventListener('contextmenu', (e) => e.preventDefault());
  });

  // A page that goes to the background must not leave a button held down.
  const releaseAll = () => { for (const b of held.values()) send('release', b); held.clear(); for (const x of document.querySelectorAll('.down')) x.classList.remove('down'); };
  document.addEventListener('visibilitychange', async () => {
    if (document.hidden) releaseAll();
    else { if (!ws || ws.readyState > 1) connect(); keepAwake(); }
  });

  // The screen stays on while the phone sits on the handlebars.
  async function keepAwake() {
    try { if ('wakeLock' in navigator && !wake) { wake = await navigator.wakeLock.request('screen'); wake.addEventListener('release', () => { wake = null; }); } }
    catch (_) { hint.textContent = 'Écran non maintenu allumé : désactive la mise en veille du téléphone.'; }
  }

  if (!/^[0-9a-f]{32}$/.test(room)) { show('Lien invalide : scanne le QR code du jeu', false); return; }
  connect();
  keepAwake();
})();
</script>
</body>
</html>
